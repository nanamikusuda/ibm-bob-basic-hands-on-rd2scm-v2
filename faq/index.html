<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>よくある質問（FAQ） | Bob</title>
  <script>
    (function () {
      var theme = null;
      try {
        theme = localStorage.getItem("faq-theme");
      } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="logo-link" href="https://www.ibm.com/products/bob" target="_blank" rel="noopener noreferrer" aria-label="Bob の製品ページを新しいタブで開く">
      <img class="logo" src="../bob.svg" alt="" width="56" height="56">
    </a>
    <div class="header-text">
      <h1>よくある質問（FAQ）</h1>
      <p class="lead">Bob に関するよくある質問と回答</p>
    </div>
    <button id="theme-toggle" class="theme-toggle" type="button"></button>
  </header>

  <div class="container">
    <div class="search">
      <label for="search-input" class="visually-hidden">FAQ を検索</label>
      <input id="search-input" type="search" placeholder="キーワードで検索" autocomplete="off">
    </div>

    <div id="tabs" class="tabs" role="tablist" aria-label="カテゴリ"></div>

    <p id="count" class="count" aria-live="polite"></p>

    <main id="faq-list"></main>

    <p id="empty" class="empty" hidden>該当するFAQが見つかりませんでした。キーワードやカテゴリを変更してください。</p>
  </div>

  <script src="faq-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
