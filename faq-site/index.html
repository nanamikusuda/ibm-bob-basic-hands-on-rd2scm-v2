<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IBM Bob よくある質問</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="header-top">
        <div class="site-title">
          <a class="site-logo-link" href="https://www.ibm.com/products/bob" target="_blank" rel="noopener noreferrer" aria-label="IBM Bob 公式サイト（新しいタブで開きます）">
            <img class="site-logo" src="bob.svg" alt="IBM Bob ロゴ" width="48" height="48">
          </a>
          <h1>IBM Bob よくある質問</h1>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="ダークテーマに切り替え" title="テーマ切り替え">
          <span class="theme-icon" aria-hidden="true">🌙</span>
        </button>
      </div>
      <div class="search">
        <label class="search-label" for="search-input">キーワードで検索</label>
        <input id="search-input" class="search-input" type="search"
               placeholder="質問や回答からキーワードで検索" autocomplete="off">
      </div>
    </div>
  </header>

  <main class="container">
    <div id="tabs" class="tabs" role="tablist" aria-label="カテゴリ"></div>

    <p id="count" class="count" aria-live="polite"></p>

    <div id="faq-list" class="faq-list" role="tabpanel"></div>

    <p id="empty" class="empty" hidden>該当する質問が見つかりませんでした。キーワードやカテゴリを変更してください。</p>
  </main>

  <footer class="site-footer">
    <div class="container">このFAQは qa.md の内容を日本語に翻訳したものです。</div>
  </footer>

  <script src="faq-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
